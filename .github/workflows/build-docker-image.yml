name: Docker Image CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image Tag
        required: true
        default: dry-run
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        libc: [gnu, musl]
    env:
      image: ghcr.io/${{ github.repository_owner }}/nxbt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        if: ${{ inputs.tag != 'dry-run' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # gnu is the default flavour, so it also gets the bare tag and "latest".
      - name: Compute tags
        id: tags
        run: |
          tags="${image}:${{ inputs.tag }}-${{ matrix.libc }},${image}:${{ matrix.libc }}"
          if [ "${{ matrix.libc }}" = "gnu" ]; then
            tags="${tags},${image}:${{ inputs.tag }},${image}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.libc }}/Dockerfile
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7,linux/386
          push: ${{ inputs.tag != 'dry-run' }}
          tags: ${{ steps.tags.outputs.tags }}
